<header class="masthead">
  <div class="masthead-inner">
    <h1 class="masthead-title">Paintings</h1>
    <p class="masthead-statement">Explore the full collection of works.</p>
  </div>
</header>

<div class="gallery-container">
  <div class="gallery-grid">
    @for (painting of paintings; track painting.id) {
      <figure
        class="gallery-item"
        [style.flex-grow]="aspect(painting)"
        [style.flex-basis.px]="aspect(painting) * rowBase"
        (click)="openModal(painting)">
        <div class="artwork-media" [style.padding-bottom.%]="100 / aspect(painting)">
          <img [src]="painting.imageurl" [alt]="painting.title" class="artwork-img" loading="lazy" decoding="async">
          @if (!painting.isavailable) {
            <div class="sold-badge" title="Sold"></div>
          }
        </div>
        <figcaption class="artwork-info">
          <h3 class="artwork-name">{{ painting.title }}</h3>
          <p class="artwork-line">
            @if (painting.medium) { <span>{{ painting.medium }}</span> }
            @if (painting.year)   { <span>{{ painting.year }}</span> }
          </p>
        </figcaption>
      </figure>
    }
  </div>

  @if (loading) {
    <div style="text-align:center;padding:40px;">
      <div class="spinner" style="margin:0 auto;"></div>
    </div>
  }

  @if (!loading && paintings.length === 0) {
    <p style="text-align:center;color:#888;padding:60px 0;">No paintings found.</p>
  }
</div>

<app-image-modal
  [imageUrl]="modalImage"
  [caption]="modalCaption"
  [visible]="modalVisible"
  (close)="closeModal()">
</app-image-modal>

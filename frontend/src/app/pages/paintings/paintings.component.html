<header class="masthead">
  <div class="masthead-inner">
    <h1 class="masthead-title">{{ t('paintings.title') }}</h1>
    <p class="masthead-statement">{{ t('paintings.statement') }}</p>
  </div>
</header>

<div class="gallery-container">
  <div class="gallery-grid">
    @for (painting of paintings; track painting.id; let i = $index) {
      <a
        class="gallery-item"
        [routerLink]="link(painting)"
        [style.flex-grow]="aspect(painting)"
        [style.flex-basis.px]="aspect(painting) * rowBase">
        <div class="artwork-media" [style.padding-bottom.%]="100 / aspect(painting)">
          <img [src]="imageUrl(painting.imageurl, 960)" [attr.srcset]="imageSrcset(painting.imageurl)" sizes="(max-width: 700px) 100vw, 60vw"
               [alt]="alt(painting)" class="artwork-img" [attr.loading]="i < 4 ? 'eager' : 'lazy'" [attr.fetchpriority]="i < 2 ? 'high' : null" decoding="async">
          @if (!painting.isavailable) {
            <div class="sold-badge" [title]="t('art.sold')"></div>
          }
        </div>
        <div class="artwork-info">
          <h2 class="artwork-name">{{ title(painting) }}</h2>
          <p class="artwork-line">{{ meta(painting) }}</p>
        </div>
      </a>
    }
  </div>

  @if (loading) {
    <div style="text-align:center;padding:40px;">
      <div class="spinner" style="margin:0 auto;"></div>
    </div>
  }

  @if (!loading && paintings.length === 0) {
    <p style="text-align:center;color:#666;padding:60px 0;">{{ t('paintings.none') }}</p>
  }
</div>

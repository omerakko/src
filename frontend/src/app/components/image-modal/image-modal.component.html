@if (visible) {
  <!-- Any tap outside the painting itself closes the view (the X is optional). -->
  <div class="modal" style="display:flex" (click)="close.emit()">
    <button type="button" class="close-modal" (click)="close.emit()" aria-label="Close">&times;</button>
    <div class="modal-content">
      <img [src]="src" [attr.srcset]="srcset" sizes="100vw" [alt]="caption" class="modal-image"
           (click)="onImageClick($event)">
      @if (caption) {
        <div class="modal-caption">{{ caption }}</div>
      }
    </div>
  </div>
}

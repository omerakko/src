# nginx site config for orelnilufer.com — lives at
# /etc/nginx/sites-available/NiluferOrel on the VPS (symlinked into
# sites-enabled). Kept in the repo so changes are reviewed like code.
#
# Apply on the server:
#   sudo cp deploy/nginx/NiluferOrel.conf /etc/nginx/sites-available/NiluferOrel
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP, any host name -> canonical HTTPS host.
server {
    listen 80;
    server_name orelnilufer.com www.orelnilufer.com 51.75.125.253;
    return 301 https://orelnilufer.com$request_uri;
}

# HTTPS on the www host or the bare IP -> canonical host. Without this the
# www variant served a full copy of the site, which search engines treat as
# duplicate content and split ranking between the two.
server {
    listen 443 ssl;
    http2 on;
    server_name www.orelnilufer.com 51.75.125.253;

    ssl_certificate     /etc/letsencrypt/live/orelnilufer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orelnilufer.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://orelnilufer.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name orelnilufer.com;

    ssl_certificate     /etc/letsencrypt/live/orelnilufer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orelnilufer.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Admin image uploads.
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
